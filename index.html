<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ece0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오목">
  <title>오목</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23dcb06b'/%3E%3Ccircle cx='24' cy='26' r='13' fill='%23111'/%3E%3Ccircle cx='40' cy='40' r='13' fill='%23fafafa' stroke='%23999'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="logo" id="logo" aria-label="오목 첫 화면으로">
      <span class="logo-stones" aria-hidden="true"><i class="b"></i><i class="w"></i></span>
      <span class="logo-text">오목</span>
    </button>
  </header>

  <main class="app">
    <!-- 첫 화면: 설정 -->
    <section id="home" class="screen home">
      <div class="home-card">
        <h1 class="home-title">오목</h1>
        <p class="home-sub">같은 색 돌 다섯 개를 먼저 이으면 이겨요</p>

        <div class="field">
          <div class="field-label">대전 방식</div>
          <div class="seg" data-name="mode">
            <button type="button" data-value="pvp">둘이서 하기</button>
            <button type="button" data-value="ai">컴퓨터와 하기</button>
          </div>
        </div>

        <div id="aiOptions">
          <div class="field">
            <div class="field-label">난이도</div>
            <div class="seg" data-name="level">
              <button type="button" data-value="easy">쉬움</button>
              <button type="button" data-value="normal">보통</button>
              <button type="button" data-value="hard">어려움</button>
            </div>
          </div>
          <div class="field">
            <div class="field-label">내 돌</div>
            <div class="seg" data-name="humanColor">
              <button type="button" data-value="black">흑<small>먼저 둠</small></button>
              <button type="button" data-value="white">백<small>나중에 둠</small></button>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="field-label">규칙</div>
          <div class="seg" data-name="rule">
            <button type="button" data-value="free">자유 규칙</button>
            <button type="button" data-value="renju">렌주 규칙</button>
          </div>
          <p class="field-hint" id="ruleHint"></p>
        </div>

        <button type="button" id="startBtn" class="btn primary big">시작</button>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game" class="screen game" hidden>
      <div class="status" id="status" aria-live="polite">
        <span class="stone-icon" id="statusStone"></span>
        <span id="statusText">흑 차례</span>
      </div>

      <div class="board-wrap" id="boardWrap">
        <canvas id="board" aria-label="오목판"></canvas>
        <div class="toast" id="toast" role="status"></div>
      </div>

      <div class="controls">
        <button type="button" class="btn small" id="undoBtn">무르기</button>
        <button type="button" class="btn small" id="newBtn">새 게임</button>
        <button type="button" class="btn small" id="soundBtn" aria-pressed="true">🔊 소리</button>
      </div>
      <p class="info" id="info"></p>
    </section>
  </main>

  <!-- 결과 안내 창 -->
  <div class="modal" id="resultModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <span class="stone-icon big" id="resultStone"></span>
      <h2 id="resultTitle">흑 승리!</h2>
      <p id="resultSub"></p>
      <div class="modal-actions">
        <button type="button" class="btn primary" id="againBtn">다시 하기</button>
        <button type="button" class="btn" id="homeBtn">첫 화면으로</button>
        <button type="button" class="link-btn" id="viewBoardBtn">판 보기</button>
      </div>
    </div>
  </div>

  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
